<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f2" />
    <title>SmartProcure | Maintenance</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18382d;
        background: #f4f7f2;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(ellipse at 12% 12%, rgb(211 231 205 / 55%), transparent 38%),
          radial-gradient(ellipse at 90% 88%, rgb(221 235 218 / 65%), transparent 34%),
          #f4f7f2;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid #e3ebe0;
        border-radius: 28px;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 24px 70px rgb(27 61 43 / 9%);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 42px;
        color: #245b3c;
        font-size: 1rem;
        font-weight: 750;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        background: #eaf3e8;
      }

      .brand-mark svg {
        width: 23px;
        height: 23px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        padding: 8px 12px;
        border: 1px solid #e5eee1;
        border-radius: 999px;
        background: #f5f9f3;
        color: #52735c;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #76a66e;
        content: "";
      }

      h1 {
        margin: 0;
        color: #173b2c;
        font-size: clamp(2.25rem, 7vw, 3.5rem);
        font-weight: 750;
        letter-spacing: -0.055em;
        line-height: 1.08;
      }

      p {
        max-width: 470px;
        margin: 20px auto 0;
        color: #63746a;
        font-size: clamp(1rem, 2.5vw, 1.1rem);
        line-height: 1.75;
      }

      .rule {
        width: 44px;
        height: 3px;
        margin: 34px auto 0;
        border-radius: 3px;
        background: #9ab98c;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        main {
          border-radius: 22px;
        }

        .brand {
          margin-bottom: 34px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="SmartProcure">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 20v-8m0 2c-4.7 0-7-2.3-7-7 4.7 0 7 2.3 7 7Zm0-3c0-4.1 2-6.1 6-6.1 0 4.1-2 6.1-6 6.1Z" stroke="#39704a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
        </span>
        SmartProcure
      </div>
      <div class="status">Under maintenance</div>
      <h1>We'll Be Back Soon!</h1>
      <p>SmartProcure is temporarily under maintenance while we make improvements. Please check back later.</p>
      <div class="rule" aria-hidden="true"></div>
    </main>
  </body>
</html>
